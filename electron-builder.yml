appId: com.orbit.launcher
productName: ORBIT
buildVersion: 0.1.2.2
artifactName: ORBIT-Setup-0.1.2-${arch}.${ext}
copyright: Copyright © 2026 Luis Garcia
forceCodeSigning: true

publish:
  - provider: github
    owner: toonymak1993
    repo: orbit

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/release-manifest.json
    to: release-manifest.json
  - from: LICENSE
    to: LICENSE
  - from: LICENSE_EXCEPTION.md
    to: LICENSE_EXCEPTION.md
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: resources/discord-social-sdk
    to: discord-social-sdk
  - from: resources/wallpapers
    to: wallpapers

asar: true
asarUnpack:
  - node_modules/7zip-bin/**/*
  - node_modules/koffi/**/*
  - node_modules/@koromix/koffi-win32-x64/**/*
compression: normal

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  executableName: ORBIT
  requestedExecutionLevel: asInvoker
  legalTrademarks: ORBIT is a gaming launcher project.
  signtoolOptions:
    certificateSha1: 61E90C0AACBF2F407A575903FCC197F45B61706D
    publisherName: "CN=Open Source Developer Luis Antonio Garcia Roque, O=Open Source Developer, L=Alfdorf, S=Baden-Württemberg, C=DE"
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://time.certum.pl

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  installerLanguages:
    - en_US
  displayLanguageSelector: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ORBIT
  runAfterFinish: true
  packElevateHelper: false
  differentialPackage: true
  uninstallDisplayName: ORBIT 0.1.2
  installerIcon: build/installerIcon.ico
  uninstallerIcon: build/uninstallerIcon.ico
  installerHeader: build/installerHeader.bmp
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  include: build/installer.nsh
